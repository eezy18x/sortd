[package]
name = "sortd"
version = "0.1.0"
description = "SORTD — local-first intelligent file organization and storage management"
authors = ["muffle"]
license = "MIT"
repository = "https://github.com/eezy18x/sortd"
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "sortd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1"
walkdir = "2"
trash = "5"
mime_guess = "2"
infer = "0.19"
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
