<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SORTD</title>
    <style>
      /* Opening screen. Inline so it paints before any JavaScript loads. */
      #splash {
        --s-bg: #0e1013;
        --s-fg: #e7e9ec;
        --s-muted: #8b929b;
        --s-subtle: #5d646d;
        --s-track: #1d2126;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--s-bg);
        color: var(--s-fg);
        font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, Ubuntu, Cantarell, sans-serif;
        transition: opacity 320ms ease, visibility 320ms;
        user-select: none;
      }
      @media (prefers-color-scheme: light) {
        #splash { --s-bg: #f6f7f8; --s-fg: #15181c; --s-muted: #5c646d; --s-subtle: #8a9199; --s-track: #e3e6ea; }
      }
      [data-theme="dark"] #splash { --s-bg: #0e1013; --s-fg: #e7e9ec; --s-muted: #8b929b; --s-subtle: #5d646d; --s-track: #1d2126; }
      [data-theme="light"] #splash { --s-bg: #f6f7f8; --s-fg: #15181c; --s-muted: #5c646d; --s-subtle: #8a9199; --s-track: #e3e6ea; }
      #splash.done { opacity: 0; visibility: hidden; }

      .s-mark {
        position: relative;
        width: 112px;
        height: 112px;
        border-radius: 26px;
        background: linear-gradient(180deg, #1f2329, #14171b);
        box-shadow: 0 0 0 1px rgb(255 255 255 / 0.07), 0 18px 50px rgb(0 0 0 / 0.35);
        animation: s-pop 520ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      .s-bar {
        position: absolute;
        left: 29px;
        height: 11px;
        border-radius: 6px;
        transform-origin: left center;
      }
      /* The three bars start "unsorted" and settle into descending order. */
      .s-bar.b1 { top: 37px; width: 66px; background: #3fd0d4; animation: s-sort-1 1100ms cubic-bezier(0.65, 0, 0.25, 1) 180ms both; }
      .s-bar.b2 { top: 58px; width: 50px; background: #2aa198; animation: s-sort-2 1100ms cubic-bezier(0.65, 0, 0.25, 1) 260ms both; }
      .s-bar.b3 { top: 79px; width: 33px; background: #8b7cf6; animation: s-sort-3 1100ms cubic-bezier(0.65, 0, 0.25, 1) 340ms both; }

      .s-word {
        margin-top: 26px;
        font-size: 26px;
        font-weight: 650;
        letter-spacing: 0.32em;
        padding-left: 0.32em;
        animation: s-rise 600ms ease-out 520ms both;
      }
      .s-tag {
        margin-top: 8px;
        font-size: 13px;
        color: var(--s-muted);
        animation: s-rise 600ms ease-out 680ms both;
      }
      .s-progress {
        position: relative;
        width: 148px;
        height: 3px;
        margin-top: 30px;
        overflow: hidden;
        border-radius: 3px;
        background: var(--s-track);
        animation: s-rise 600ms ease-out 760ms both;
      }
      .s-progress::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 -40%;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, #3fd0d4, transparent);
        animation: s-scan 1300ms ease-in-out infinite;
      }
      .s-credit {
        position: absolute;
        bottom: 30px;
        font-size: 12px;
        letter-spacing: 0.02em;
        color: var(--s-subtle);
        animation: s-rise 700ms ease-out 900ms both;
      }
      .s-credit b { color: var(--s-muted); font-weight: 600; }

      @keyframes s-pop { from { opacity: 0; transform: scale(0.82); } }
      @keyframes s-rise { from { opacity: 0; transform: translateY(8px); } }
      @keyframes s-scan { to { left: 100%; } }
      @keyframes s-sort-1 { 0% { transform: scaleX(0.35); } 45% { transform: scaleX(0.55); } 100% { transform: scaleX(1); } }
      @keyframes s-sort-2 { 0% { transform: scaleX(1.3); } 45% { transform: scaleX(0.6); } 100% { transform: scaleX(1); } }
      @keyframes s-sort-3 { 0% { transform: scaleX(1.95); } 45% { transform: scaleX(1.35); } 100% { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="SORTD is starting">
      <div class="s-mark" aria-hidden="true">
        <span class="s-bar b1"></span>
        <span class="s-bar b2"></span>
        <span class="s-bar b3"></span>
      </div>
      <div class="s-word">SORTD</div>
      <div class="s-tag">Your files. Finally under control.</div>
      <div class="s-progress" aria-hidden="true"></div>
      <div class="s-credit">Created and managed by <b>muffle</b></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
