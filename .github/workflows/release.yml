name: Release builds

# Builds installers for every platform. Runs on version tags (creating a
# draft release) and on manual dispatch (uploading artifacts only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (MSI + NSIS)
            os: windows-latest
            args: ""
          - name: macOS Apple Silicon (DMG)
            os: macos-14
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - name: macOS Intel (DMG)
            os: macos-13
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - name: Linux x64 (AppImage, deb, rpm)
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev rpm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build and (on tags) draft a release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "SORTD ${{ github.ref_name }}"
          releaseBody: |
            ## Install
            - **Windows:** download `*_x64-setup.exe` (or the `.msi`). SmartScreen may warn on unsigned builds: More info → Run anyway.
            - **macOS:** `*_aarch64.dmg` for Apple Silicon, `*_x64.dmg` for Intel. Not notarized yet: right-click SORTD → Open, or `xattr -dr com.apple.quarantine /Applications/SORTD.app`.
            - **Linux:** `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE) or `.AppImage` (any distro, `chmod +x` first).

            See CHANGELOG.md for what changed.
          releaseDraft: true
          prerelease: true
      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sortd-${{ matrix.os }}${{ matrix.rust_target && format('-{0}', matrix.rust_target) || '' }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
          if-no-files-found: warn
